[project]
name = "mediterranean-rescue"
version = "0.1.0"
description = "Historical rescue data platform with provenance and controlled publication"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2.18,<5.3",
  "psycopg[binary]>=3.3.6,<3.4",
  "gunicorn>=23,<27",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["ruff>=0.14,<0.18"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
exclude = ["backend/catalog/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

components:
  schemas:
    BlockingReasonEnum:
      enum:
      - read_rejected
      - read_partial
      - file_errors
      type: string
      description: |-
        * `read_rejected` - read_rejected
        * `read_partial` - read_partial
        * `file_errors` - file_errors
    Candidate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        summary:
          $ref: '#/components/schemas/Summary'
      required:
      - external_id
      - id
      - summary
    Counts:
      type: object
      properties:
        records_read:
          type: integer
        rows_diagnosed:
          type: integer
        blank_rows_skipped:
          type: integer
        file_errors:
          type: integer
        rows_with_errors:
          type: integer
        rows_with_warnings:
          type: integer
        errors:
          type: integer
        warnings:
          type: integer
      required:
      - blank_rows_skipped
      - errors
      - file_errors
      - records_read
      - rows_diagnosed
      - rows_with_errors
      - rows_with_warnings
      - warnings
    DataModeEnum:
      enum:
      - production
      - training
      type: string
      description: |-
        * `production` - production
        * `training` - training
    Decided:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/PublicationActionEnum'
        count:
          type: integer
      required:
      - action
      - count
    Decision:
      type: object
      properties:
        identity:
          type: string
          format: uuid
        external_id:
          type: string
        match:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
      - approved_at
      - approved_by
      - external_id
      - identity
      - match
      - reason
    DecisionRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/PublicationActionEnum'
        events:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - action
      - events
      - reason
    DecisionRequestActionEnum:
      enum:
      - create_identity
      - link
      type: string
      description: |-
        * `create_identity` - create_identity
        * `link` - link
    DecisionRequestRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/DecisionRequestActionEnum'
        identity:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - action
      - reason
    Diagnostic:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/SourceRef'
        sheet:
          $ref: '#/components/schemas/SheetEnum'
        sha256:
          type: string
        bytes:
          type: integer
        contract_version:
          type: string
        source_read:
          type: string
        normalization:
          type: string
        counts:
          $ref: '#/components/schemas/Counts'
        issues_by_code:
          type: array
          items:
            $ref: '#/components/schemas/IssueCount'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        issues_truncated:
          type: boolean
        stageable:
          type: boolean
        blocking_reason:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/BlockingReasonEnum'
          - $ref: '#/components/schemas/NullEnum'
        existing_snapshot:
          type: string
          format: uuid
          nullable: true
      required:
      - blocking_reason
      - bytes
      - contract_version
      - counts
      - existing_snapshot
      - issues
      - issues_by_code
      - issues_truncated
      - normalization
      - sha256
      - sheet
      - source
      - source_read
      - stageable
    Error:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        errors: {}
      required:
      - code
      - detail
    ErrorCount:
      type: object
      properties:
        code:
          type: string
        rows:
          type: integer
      required:
      - code
      - rows
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        occurred_on:
          type: string
          format: date
          readOnly: true
          title: Date
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        people:
          type: integer
          readOnly: true
          nullable: true
          description: Leave empty when not known; never 0.
        women:
          type: integer
          readOnly: true
          nullable: true
        minors:
          type: integer
          readOnly: true
          nullable: true
        source_url:
          type: string
          format: uri
          readOnly: true
          title: Source address
        source:
          $ref: '#/components/schemas/Source'
        vessel:
          allOf:
          - $ref: '#/components/schemas/Vessel'
          nullable: true
        voyage:
          allOf:
          - $ref: '#/components/schemas/Voyage'
          nullable: true
        port:
          allOf:
          - $ref: '#/components/schemas/Port'
          nullable: true
        position:
          allOf:
          - $ref: '#/components/schemas/Position'
          nullable: true
          readOnly: true
      required:
      - id
      - kind
      - minors
      - occurred_on
      - people
      - port
      - position
      - source
      - source_url
      - summary
      - title
      - vessel
      - voyage
      - women
    EventCounts:
      type: object
      properties:
        draft:
          type: integer
        published:
          type: integer
        withdrawn:
          type: integer
      required:
      - draft
      - published
      - withdrawn
    EventPage:
      type: object

  /api/private/v1/history/:
    get:
      operationId: private_history
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - verify
          - prepare
          - publish
          - withdraw
          - port
          - correction
          type: string
          minLength: 1
        description: |-
          * `verify` - verify
          * `prepare` - prepare
          * `publish` - publish
          * `withdraw` - withdraw
          * `port` - port
          * `correction` - correction
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: offset
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
      - in: query
        name: scope
        schema:
          enum:
          - mine
          - team
          type: string
          default: mine
          minLength: 1
        description: |-
          * `mine` - mine
          * `team` - team
      tags:
      - history
      security:
      - privateSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:

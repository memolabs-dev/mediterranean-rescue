        id:
          type: string
        kind:
          $ref: '#/components/schemas/HistoryItemKindEnum'
        at:
          type: string
          format: date-time
        actor:
          type: string
        reason:
          type: string
        detail:
          type: string
          description: new, reviewed_match, applied, ports, vessel…
        subject:
          $ref: '#/components/schemas/HistorySubject'
        path:
          type: string
          nullable: true
          description: Where the decided item can be seen.
      required:
      - actor
      - at
      - detail
      - id
      - kind
      - path
      - reason
      - subject
    HistoryItemKindEnum:
      enum:
      - verify

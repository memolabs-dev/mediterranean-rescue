name: mediterranean-rescue
services:
  db:
    build:
      context: .
      dockerfile: infra/Dockerfile.db
    platform: linux/amd64
    environment:
      POSTGRES_DB: rescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/init_local.py}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init_local.py}
    volumes:
      - rescue_pg17_postgis36:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$DB_PASSWORD" psql -h 127.0.0.1 -U rescue -d rescue -Atqc "SELECT 1"']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "backend/manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
  # The two scheduled readers, opt-in: `docker compose --profile sync up -d`. Each loops and
  # records every pass in the database (SheetSync); the team space shows the last result.
  sync-sheets:
    profiles: ["sync"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-u", "backend/manage.py", "sync_sheets", "--every", "300"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
      SHEETS_SYNC_CONFIG: /app/data/local/sheets-sync.json
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  sync-logbook:
    profiles: ["sync"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-u", "backend/manage.py", "sync_logbook", "--every", "21600"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  rescue_pg17_postgis36:

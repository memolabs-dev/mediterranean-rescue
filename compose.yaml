name: mediterranean-rescue
services:
  db:
    build:
      context: .
      dockerfile: infra/Dockerfile.db
    platform: linux/amd64
    environment:
      POSTGRES_DB: rescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run scripts/init_local.py}
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/init_local.py}
    volumes:
      - rescue_pg17_postgis36:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'PGPASSWORD="$$DB_PASSWORD" psql -h 127.0.0.1 -U rescue -d rescue -Atqc "SELECT 1"']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "backend/manage.py", "runserver", "0.0.0.0:8000", "--noreload"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
    ports: ["127.0.0.1:8010:8000"]
    volumes:
      - ./backend:/app/backend
      - ./contracts:/app/contracts
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
  # The Vite dev server for `make dev`, so Docker is the only thing to install. Running pnpm on
  # the host instead (`cd frontend && pnpm dev`) still works against the `api` port above.
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0"]
    environment:
      API_TARGET: http://api:8000
      npm_config_store_dir: /pnpm-store
    ports: ["127.0.0.1:5173:5173"]
    volumes:
      - ./frontend:/app/frontend
      - ./contracts:/app/contracts:ro
      # The design-token test compares the app's tokens with docs/design/tokens.css.
      - ./docs:/app/docs:ro
      - frontend_node_modules:/app/frontend/node_modules
      - pnpm_store:/pnpm-store
    depends_on:
      - api
  # The two scheduled readers, opt-in: `docker compose --profile sync up -d`. Each loops and
  # records every pass in the database (SheetSync); the team space shows the last result.
  sync-sheets:
    profiles: ["sync"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-u", "backend/manage.py", "sync_sheets", "--every", "300"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
      SHEETS_SYNC_CONFIG: /app/data/local/sheets-sync.json
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  sync-logbook:
    profiles: ["sync"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "--no-sync", "python", "-u", "backend/manage.py", "sync_logbook", "--every", "21600"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: rescue
      POSTGRES_DB: rescue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  rescue_pg17_postgis36:
  frontend_node_modules:
  pnpm_store:

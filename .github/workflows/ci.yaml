name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --frozen ruff check backend scripts
      - run: uv run --frozen ruff format --check backend scripts

  verify:
    name: Tests, contract and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install package manager
        run: npm install --global pnpm@12.10.1
      - name: Prepare isolated environment
        run: python3 scripts/init_local.py
      - name: Build backend and database
        run: docker compose build
      - name: Backend integration tests on PostGIS
        run: docker compose run --rm api uv run --no-sync python backend/manage.py test catalog.tests --noinput
      - name: Migration contract
        run: docker compose run --rm api uv run --no-sync python backend/manage.py makemigrations --check --dry-run
      - name: Production configuration checks (without deployment)
        run: docker compose run --rm -e DJANGO_ENV=production -e DJANGO_ALLOWED_HOSTS=rescue.invalid api uv run --no-sync python backend/manage.py check --deploy --fail-level WARNING
      - name: Export and validate OpenAPI contract
        run: docker compose run --rm -T api uv run --no-sync python backend/manage.py spectacular --lang en --validate --fail-on-warn > contracts/openapi.yaml
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate frontend REST types
        working-directory: frontend
        run: pnpm codegen
      - name: Refuse generated contract drift
        run: git diff --exit-code -- contracts/openapi.yaml frontend/src/api/schema.d.ts
      - name: Prove invalid REST use fails type checking
        run: python3 scripts/check_contract_negative.py
      - name: Frontend checks
        working-directory: frontend
        run: pnpm lint && pnpm test && pnpm build
      - name: Stop test services, preserve volume until runner cleanup
        if: always()
        run: docker compose down

  e2e:
    name: End-to-end on the production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rescue:ci
          cache-from: type=gha
      - name: Start the reference stack
        run: |
          python3 - <<'PY'
          import secrets
          open("deploy/.env", "w").write(
              "DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost\n"
              f"DJANGO_SECRET_KEY={secrets.token_urlsafe(48)}\n"
              f"POSTGRES_ADMIN_PASSWORD={secrets.token_urlsafe(24)}\n"
              f"DB_PASSWORD={secrets.token_urlsafe(24)}\n"
              "DATA_MODE=production\nDJANGO_BEHIND_TLS_PROXY=1\nDJANGO_NUM_PROXIES=1\n"
          )
          PY
          echo '{}' > deploy/sheets-sync.json
          RESCUE_IMAGE=rescue:ci RESCUE_PORT=8000 docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --wait web
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install package manager
        run: npm install --global pnpm@12.10.1
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Browser downloads intermittently stalled for >7 min on hosted runners.
      # Cache exact lockfile only; Linux packages always need independent installation.
      - name: Restore versioned Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install browser system dependencies
        working-directory: frontend
        timeout-minutes: 5
        run: |
          date -u '+Browser system dependencies started: %FT%TZ'
          pnpm exec playwright install-deps chromium webkit
          date -u '+Browser system dependencies completed: %FT%TZ'
      - name: Verify browser binaries, retry transient CDN failures
        working-directory: frontend
        timeout-minutes: 9
        run: |
          date -u '+Browser binary verification started: %FT%TZ'
          for attempt in 1 2 3; do
            # Always verify even on a cache hit: broken caches must never skip E2E.
            if timeout 150s pnpm exec playwright install chromium webkit; then
              date -u '+Browser binaries ready: %FT%TZ'
              exit 0
            fi
            echo "::warning::Playwright download/verification attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Playwright browsers not installed after three attempts"
          exit 1
      - name: Run the end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_FORWARDED_PROTO: https
        run: pnpm e2e
      # A separate training mode runs only inside this disposable CI runner, never in production.
      # Reuse the already-built image and ephemeral DB after the normal production smoke suite.
      - name: Seed fictional training database for browser proof
        run: |
          sed -i 's/^DATA_MODE=production$/DATA_MODE=training/' deploy/.env
          printf '\nDJANGO_ENV=development\n' >> deploy/.env
          RESCUE_IMAGE=rescue:ci RESCUE_PORT=8000 docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --force-recreate --wait web
          RESCUE_IMAGE=rescue:ci RESCUE_PORT=8000 docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm -T web seed_kickoff_demo --confirm-local-training
      - name: Verify fictional map and evidence in real browsers
        working-directory: frontend
        env:
          E2E_KICKOFF: '1'
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_FORWARDED_PROTO: https
        run: pnpm exec playwright test kickoff-
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: fictional-rescue-browser-proof
          path: frontend/test-results/**/kickoff-fictional-*.png
          if-no-files-found: error
          retention-days: 14
      # This stack is disposable; use random one-run credentials that cannot work outside CI.
      # Auth traces are disabled in the dedicated test to avoid archiving passwords.
      - name: Seed synthetic review identities with random browser-only password
        run: |
          python3 - <<'PY'
          import os
          import secrets
          password = secrets.token_urlsafe(36)
          with open("deploy/.env", "a", encoding="utf-8") as file:
              file.write(f"\nRESCUE_REVIEW_DEMO_PASSWORD={password}\nSIGN_IN_RATE=100/min\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write(f"RESCUE_REVIEW_DEMO_PASSWORD={password}\n")
          PY
          RESCUE_IMAGE=rescue:ci RESCUE_PORT=8000 docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --force-recreate --wait web
          RESCUE_IMAGE=rescue:ci RESCUE_PORT=8000 docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm -T web seed_review_browser_demo --confirm-local-training
      - name: Review, prepare, publish and withdraw fictitious event in real browser
        working-directory: frontend
        env:
          E2E_REVIEW_DEMO: '1'
          E2E_BASE_URL: http://127.0.0.1:8000
          # This throwaway server runs in DEBUG over plain HTTP; claiming forwarded TLS
          # would make Django's strict Origin/CSRF checks correctly reject this test login.
        run: pnpm exec playwright test e2e/reviewer-journey.e2e.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Server logs
        if: failure()
        run: docker compose -f deploy/compose.yaml --env-file deploy/.env logs web

  image:
    name: Production image
    needs: [lint, verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built on every run so a pull request proves the image still builds; pushed only from a
      # green commit of main. rescue.memolabs.dev pulls :latest within minutes (lab autodeploy,
      # which also refuses a commit whose checks are red).
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
